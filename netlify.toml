# SafeWatch — Netlify
# Form gönderimi: /api/send-feedback (Resend, Netlify Function)
# Forms paneli kullanılmaz.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  GITHUB_PAGES = "false"

# Handler dışında dosya koyma: *.test.ts function adına nokta ekler (deploy 422).

[functions]
  node_bundler = "esbuild"
